<!DOCTYPE html>
<html>

<head>
    <title>My Cart</title>
    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container">
<h1>My Cart</h1>

<table border="1" align="center" cellpadding="10">

<tr>
    <th>Cart ID</th>
    <th>Product</th>
    <th>Quantity</th>
    <th>Price</th>
    <th>Total</th>
    <th>Action</th>
</tr>

{% for item in cart %}

<tr>

    <td>{{ item[0] }}</td>

    <td>{{ item[3] }}</td>

    <td>{{ item[4] }} {{ item[5] }}</td>

    <td>₹ {{ item[6] }}</td>

    <td>₹ {{ item[4] * item[6] }}</td>

    <td>
        <a href="/remove_cart/{{ item[0] }}">
            <button>Remove</button>
        </a>
    </td>

</tr>

{% endfor %}

</table>

<br><br>
<a href="/cart_checkout">
    <button>Place Order</button>
</a>
<br><br>

<a href="/buyer_dashboard">
    <button>Back</button>
</a>
</div>
</body>

</html>
